name: Sveglia del trader

on:
  schedule:
    # GitHub ragiona in ora UTC: Roma è UTC+1 d'inverno e UTC+2 d'estate, quindi ogni sveglia
    # ha due righe e il primo passo lascia lavorare solo quella che a Roma dà l'orario giusto.
    # Gli orari sono un po' prima del dovuto perché GitHub a volte parte in ritardo.
    - cron: "12 6 * * 1-5"     # piano 08:12 (estate)
    - cron: "12 7 * * 1-5"     # piano 08:12 (inverno)
    - cron: "17 7 * * 1-5"     # apertura 09:17 (estate)
    - cron: "17 8 * * 1-5"     # apertura 09:17 (inverno)
    - cron: "43 10 * * 1-5"    # metà seduta 12:43 (estate)
    - cron: "43 11 * * 1-5"    # metà seduta 12:43 (inverno)
    - cron: "52 14 * * 1-5"    # chiusura 16:52 (estate)
    - cron: "52 15 * * 1-5"    # chiusura 16:52 (inverno)
    - cron: "3 16 * * 5"       # pagella venerdì 18:03 (estate)
    - cron: "3 17 * * 5"       # pagella venerdì 18:03 (inverno)
  workflow_dispatch:             # lancio a mano, o dall'iPhone (Comandi Rapidi)
    inputs:
      momento:
        description: "Vuoto = deciso dall'ora di Roma. Oppure: piano, apertura, meta, chiusura, pagella, prova, verifica (solo chiavi)"
        required: false
        default: ""

# Una sveglia alla volta: se ne parte un'altra, aspetta che la prima finisca.
concurrency:
  group: trader
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  TZ: Europe/Rome

jobs:
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: È l'ora giusta?
        id: ora
        env:
          RIGA: ${{ github.event.schedule }}
        run: |
          vai=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Che ora di Roma voleva dire questa riga, con il fuso di oggi?
            read -r minuto ora _ <<< "$RIGA"
            spostamento=$((10#$(date +%z | tr -d +) / 100))
            voluta=$(printf "%02d%02d" $(((ora + spostamento) % 24)) "$minuto")
            case "$voluta" in 0812|0917|1243|1652|1803) ;; *) vai=0 ;; esac
            echo "Riga «$RIGA» = $voluta a Roma"
            # GitHub a volte lancia gli orari con ore di ritardo: il 27/10 la riga delle 9:17 è partita
            # alle 15:28 e ha fatto la chiusura al posto di quella vera. Oltre 20 minuti di ritardo si salta.
            ritardo=$(( 10#$(date +%H) * 60 + 10#$(date +%M) - (10#${voluta:0:2} * 60 + 10#${voluta:2:2}) ))
            if (( ritardo < 0 || ritardo > 20 )); then echo "In ritardo di $ritardo minuti: salto"; vai=0; fi
          fi
          echo "Ora di Roma $(date +%H:%M), sveglia: $vai"
          echo "LAVORA=$vai" >> "$GITHUB_ENV"

      # Se la sentinella sta salvando il conto, si aspetta che finisca (dura un minuto):
      # così la sveglia parte dal conto con i suoi ordini e i due salvataggi non si scontrano.
      - name: Aspetto la sentinella
        if: env.LAVORA == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w sentinella.yml -s in_progress --json databaseId --jq length)
            [ "$n" = 0 ] && exit 0
            echo "La sentinella sta lavorando: aspetto"; sleep 15
          done

      # Sempre l'ultima versione di main, non quella di quando la sveglia è stata lanciata:
      # se nel frattempo un'altra sveglia ha salvato il conto, si parte da quel conto.
      - uses: actions/checkout@v4
        if: env.LAVORA == '1'
        with:
          ref: main

      # L'iPhone e gli orari di GitHub lanciano la stessa sveglia: la seconda che arriva
      # trova la prima appena fatta (meno di 45 minuti fa) e si ferma subito, senza consumare minuti.
      - name: Già fatta dall'iPhone?
        if: env.LAVORA == '1' && github.event_name == 'schedule'
        run: |
          python3 - <<'FINE'
          import json, os
          from datetime import datetime
          quando = json.load(open("stato/conto.json")).get("ultima_sveglia", {}).get("quando")
          if quando:
              prima = datetime.fromisoformat(quando)
              minuti = (datetime.now(prima.tzinfo) - prima).total_seconds() / 60
              if 0 <= minuti < 45:
                  print(f"Sveglia già fatta {minuti:.0f} minuti fa: mi fermo.")
                  open(os.environ["GITHUB_ENV"], "a").write("LAVORA=0\n")
          FINE

      - uses: actions/setup-python@v5
        if: env.LAVORA == '1'
        with:
          python-version: "3.12"

      - name: Librerie e modello Timestral (dalla cache se ci sono già)
        if: env.LAVORA == '1'
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/huggingface
          key: trader-${{ runner.os }}-v1

      - name: Installazione
        if: env.LAVORA == '1'
        run: |
          if ! .venv/bin/python -c "import torch, timestral, certifi" 2>/dev/null; then
            rm -rf .venv
            python -m venv .venv
            .venv/bin/pip install -q certifi numpy
            # Solo la versione per processore: niente librerie per schede grafiche (2 GB in meno).
            .venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            .venv/bin/pip install -q "git+https://github.com/mistralai/timestral.git"
          fi
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sveglia
        if: env.LAVORA == '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOMENTO: ${{ inputs.momento }}
        run: |
          case "$MOMENTO" in ""|piano|apertura|meta|chiusura|pagella|prova|verifica) ;; *) echo "Momento sconosciuto: $MOMENTO"; exit 1 ;; esac
          .venv/bin/python -c "import json, os; open('stato/telegram.json', 'w').write(json.dumps({'token': os.environ['TELEGRAM_TOKEN'], 'chat_id': os.environ['TELEGRAM_CHAT_ID']}))"
          if [ "$MOMENTO" = verifica ]; then
            # Prova le chiavi senza toccare il conto: una domanda a Claude e un messaggio su Telegram.
            risposta=$(claude -p "Rispondi solo con la parola: pronto" --tools "" --no-session-persistence 2>&1 || true)
            echo "Claude risponde: $risposta"
            .venv/bin/python -c "import sys, telegram; telegram.invia('🔧 Verifica delle chiavi su GitHub: Claude risponde «' + sys.argv[1] + '». Nessun ordine.')" "$risposta"
            rm -f stato/telegram.json
            case "$risposta" in *pronto*) exit 0 ;; *) exit 1 ;; esac
          fi
          .venv/bin/python giro.py $MOMENTO 2>&1 | tee -a stato/giri.log
          rm -f stato/telegram.json

      - name: Salvo il conto nel repository
        if: always() && env.LAVORA == '1'
        run: |
          rm -f stato/telegram.json
          git config user.name "Trader Claude"
          git config user.email "trader-claude@users.noreply.github.com"
          git add stato dashboard.html
          git diff --cached --quiet && exit 0
          git commit -q -m "Sveglia $(date '+%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1
